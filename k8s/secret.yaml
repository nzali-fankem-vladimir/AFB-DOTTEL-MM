# NOTE : namespace et conventions de nommage definitives a confirmer
# avec la DSI (voir CLAUDE.md section 14).
#
# ATTENTION : ce fichier ne doit JAMAIS contenir de vraies valeurs
# committees dans le depot Git. Les valeurs ci-dessous sont des
# placeholders en base64 (encodage de "CHANGEME"), a remplacer par
# le mecanisme de gestion de secrets retenu par la DSI (Vault,
# Sealed Secrets, etc.) avant tout deploiement reel.
#
# Si tu places un jour de vraies valeurs ici pour un test local,
# ajoute imperativement k8s/secret.yaml a .gitignore avant de
# committer quoi que ce soit.
#
# Sprint MM.14 : DOTTEL_JWT_SECRET a ete RETIREE de ce Secret. Depuis
# MM.7, Keycloak est l'unique emetteur de jetons (portee P-2) : le
# backend valide via JWKS a partir de DOTTEL_KEYCLOAK_ISSUER_URI
# (ConfigMap), plus aucun secret partage n'est lu. JwtUtil.java n'existe
# plus. La variable etait morte, elle n'est plus provisionnee.
apiVersion: v1
kind: Secret
metadata:
  name: dottel-secret
type: Opaque
data:
  # echo -n "CHANGEME" | base64

  # --- Base de donnees ---
  # DB_USER est place ICI et non dans le ConfigMap : c'est la moitie d'un
  # couple d'identification, indissociable de DB_PASSWORD, et CLAUDE.md
  # section 14 le range explicitement parmi les valeurs sensibles a
  # injecter par Secret. DB_URL reste dans le ConfigMap : une URL de
  # service interne au cluster n'authentifie personne.
  DB_USER: Q0hBTkdFTUU=
  DB_PASSWORD: Q0hBTkdFTUU=

  # --- Notifications Outlook (Sprint MM.13, provisoire) ---
  # Lus uniquement lorsque DOTTEL_NOTIFICATIONS_ENABLED vaut true
  # (ConfigMap). Identifiants du compte d'envoi a fournir par la DSI
  # en meme temps que DOTTEL_MAIL_HOST (point bloquant de MM.17).
  DOTTEL_MAIL_USERNAME: Q0hBTkdFTUU=
  DOTTEL_MAIL_PASSWORD: Q0hBTkdFTUU=
