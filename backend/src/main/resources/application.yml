spring:
  application:
    name: dottel
  profiles:
    active: dev
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
  mail:
    # Canal Outlook PROVISOIRE (Sprint MM.13). Les parametres reels (serveur,
    # port, identifiants) ne sont pas connus : point en attente DSI. Aucune
    # valeur sensible en dur, meme regle que DB_PASSWORD et
    # DOTTEL_KEYCLOAK_ISSUER_URI (CLAUDE.md sections 17.6 et 18.10). Ces
    # valeurs ne sont lues que lorsque dottel.notifications.enabled vaut true.
    host: ${DOTTEL_MAIL_HOST:}
    port: ${DOTTEL_MAIL_PORT:587}
    username: ${DOTTEL_MAIL_USERNAME:}
    password: ${DOTTEL_MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
  security:
    oauth2:
      resourceserver:
        jwt:
          # Sprint MM.7 : Keycloak devient l'unique emetteur de jetons (decision
          # de portee P-2). Aucune valeur de repli -- l'URL du realm vient
          # exclusivement de l'environnement (ConfigMap/Secret Kubernetes en
          # production, variable de shell en developpement), meme regle que
          # DOTTEL_JWT_SECRET auparavant (CLAUDE.md sections 17.6 et 18.10).
          # Local et provisoire : http://localhost:8180/realms/dottel-dev
          # (voir docker-compose.yml, service keycloak). Le realm reel de la
          # DSI reste hors perimetre -- seule cette variable changera le jour
          # de la bascule (voir docs/monolithe-modulaire/MM.7_bascule_realm_dsi.md).
          issuer-uri: ${DOTTEL_KEYCLOAK_ISSUER_URI}

server:
  port: 8080
  servlet:
    context-path: /api

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
  health:
    # Sprint MM.13 : spring-boot-starter-mail fait auto-enregistrer un
    # MailHealthIndicator qui ouvre une connexion SMTP a chaque appel de
    # /actuator/health. Desactive INCONDITIONNELLEMENT, pour la meme raison
    # que l'echec d'envoi est avale par NotificationEventListener (decision
    # N-2) : une notification est un CONFORT, jamais une condition de
    # fonctionnement du module.
    #
    # /actuator/health sert de liveness/readiness probe Kubernetes (CLAUDE.md
    # section 14). Laisser cet indicateur actif ferait passer le endpoint a
    # DOWN (503) sur un simple serveur mail injoignable : Kubernetes
    # retirerait alors du trafic des pods parfaitement capables de traiter le
    # workflow de dotation. Ce serait exactement le comportement que N-1/N-2
    # cherchent a empecher, deplace au niveau de l'infrastructure.
    mail:
      enabled: false

logging:
  level:
    com.afriland.dottel: INFO

app:
  cors:
    # Origine du frontend reel, injectee par variable d'environnement
    # (ConfigMap Kubernetes en production, cf. CLAUDE.md section 14).
    # Jamais de wildcard * : CorsConfig active allowCredentials(true),
    # que Spring refuse de combiner avec une origine generique.
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000}

dottel:
  notifications:
    # DESACTIVE PAR DEFAUT (Sprint MM.13) : sans ce drapeau a true, c'est
    # NotificationServiceStub qui s'active et se contente de journaliser --
    # le developpement local n'exige donc aucun serveur mail.
    enabled: ${DOTTEL_NOTIFICATIONS_ENABLED:false}
    # Adresse d'expedition reelle a confirmer par la DSI en meme temps que les
    # parametres spring.mail ci-dessus.
    expediteur: ${DOTTEL_NOTIFICATIONS_EXPEDITEUR:dottel-noreply@afrilandfirstbank.cm}
  kafka:
    # Topic de publication de l'evenement de cloture (Sprint 5.3). DOTTEL est
    # producer uniquement, la comptabilite (hors perimetre DOTTEL) l'ecoute.
    topic-cloture: dottel.processus.cloture
  documents:
    # Chemin de stockage local du PDF genere. Limitation temporaire : un
    # stockage local au pod ne survit pas a un redemarrage Kubernetes. En
    # attente d'une solution de stockage persistante (volume K8s ou object
    # storage) a fournir par la DSI - voir CLAUDE.md section 14.
    chemin-stockage: ${DOTTEL_DOCUMENTS_CHEMIN_STOCKAGE:./documents/}
    # Valeur de repli pour beneficiaires.chapitre quand la donnee EHR est
    # absente (beneficiaires enroles avant le Sprint 3.4). Filet de securite
    # temporaire en attendant une donnee EHR fiable pour tous les beneficiaires.
    chapitre-defaut: ${DOTTEL_DOCUMENTS_CHAPITRE_DEFAUT:37210100}
