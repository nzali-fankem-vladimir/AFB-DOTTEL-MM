spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  jpa:
    show-sql: false
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS}

# Prefixe server.error (et non spring.web.error, qui n'est lie par aucune
# @ConfigurationProperties de Spring Boot -- ecart releve a l'audit
# Sprint 6F.9). Redondant avec les valeurs par defaut et avec
# GlobalExceptionHandler, mais rend l'intention explicite et resistante a
# un futur changement de defaut.
server:
  error:
    include-stacktrace: never
    include-message: never
    include-exception: false
    include-binding-errors: never

logging:
  level:
    root: WARN
    "[com.afriland.dottel]": INFO