services:
  kafka:
    image: apache/kafka:3.8.0
    container_name: dottel-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      CLUSTER_ID: dottel-dev-kafka-cluster

  # Keycloak LOCAL et PROVISOIRE (Sprint MM.7).
  # Ce service simule, sur le poste de developpement, un realm Keycloak.
  # Il ne represente en aucun cas le realm reel d'Afriland First Bank, dont
  # l'URL, le client et le mapping des roles restent a confirmer par la DSI.
  # Meme logique que le service kafka ci-dessus depuis le Sprint 5.3 : une
  # dependance d'infrastructure simulee localement, jamais un service distant.
  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    container_name: dottel-keycloak
    command: start-dev --import-realm
    ports:
      - "8180:8080"
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USER}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      KC_HEALTH_ENABLED: "true"
    volumes:
      # Realm de developpement versionne (5 roles RoleEnum, client PKCE,
      # 5 utilisateurs de test alignes sur V3__insertion_utilisateurs_test.sql).
      # Approche "fichier JSON monte" retenue plutot que la console manuelle :
      # reproductible par toute personne clonant le depot.
      - ./keycloak/realm-dottel-dev.json:/opt/keycloak/data/import/realm-dottel-dev.json:ro